[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pptrepair"
dynamic = ["version"]
description = "Diagnose (and eventually repair) PowerPoint .pptx files corrupted while stored on OneDrive"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
keywords = ["powerpoint", "pptx", "onedrive", "repair", "zip", "corruption"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
pptrepair = "pptrepair.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]
gui = ["PySide6>=6.8"]

[tool.setuptools]
packages = ["pptrepair", "pptrepair.gui"]

[tool.setuptools.dynamic]
version = {attr = "pptrepair.__version__"}

[tool.setuptools.package-data]
pptrepair = ["locale/*/LC_MESSAGES/*.mo"]
